settings:
  lib_name: sky130_custom_dff_lib
  cell_defaults:
    models:
      - /path/to/your/sky130A/libs.tech/ngspice/sky130.lib.spice typical
    slews: [0.01, 0.05, 0.1, 0.2, 0.5]
    loads: [0.001, 0.005, 0.01, 0.025, 0.05]
    temperature: 27.0
    voltage: 1.8

cells:
  dff_final:
    netlist: dff_final.spice
    pins:
      - D
      - CLK
      - VDD
      - GND
      - Q
    clock: CLK
